version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-stream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_stream}
      POSTGRES_USER: ${POSTGRES_USER:-smartstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/docker/postgres:/var/lib/postgresql/data
    networks:
      - smart-stream-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartstream} -d ${POSTGRES_DB:-smart_stream}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-stream:latest
    container_name: smart-stream-backend
    restart: unless-stopped
    ports:
      - "${WEB_API_PORT:-17777}:${WEB_API_PORT:-17777}"  # Web API
      - "${TV_APP_API_PORT:-18888}:${TV_APP_API_PORT:-18888}"  # TV Client API
    volumes:
      - /srv/storage/media:/app/storage/media
      - /srv/storage/posters:/app/storage/posters
      - /srv/storage/downloads:/app/storage/downloads
    environment:
      # Storage paths mapped to host directories
      - POSTERS_DIR=/app/storage/posters
      - MEDIA_DIR=/app/storage/media
    networks:
      - smart-stream-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:$${WEB_API_PORT:-17777}/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:17777}
    image: smart-stream-frontend:latest
    container_name: smart-stream-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - smart-stream-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  smart-stream-network:
    driver: bridge
