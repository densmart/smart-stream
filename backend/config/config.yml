# app settings
app:
  jwt-secret: ${JWT_SECRET|supersecret}

# logger settings
logger:
  level: ${LOG_LEVEL|debug}

# admin user settings
admin-user:
  login: ${ADMIN_LOGIN|admin}
  password: ${ADMIN_PASSWORD|admin}

# APIs settings
api:
  web:
    port: ${WEB_API_PORT|17777}
  client:
    port: ${TV_APP_API_PORT|18888}

# database settings
db:
  postgres:
    # Option 1: Full DSN string (takes priority if set)
    dsn: ${POSTGRES_DSN|}
    # Option 2: Individual connection parameters (used if DSN is empty)
    host: ${POSTGRES_HOST|localhost}
    port: ${POSTGRES_PORT|5432}
    database: ${POSTGRES_DB|smart_stream}
    user: ${POSTGRES_USER|smartstream}
    password: ${POSTGRES_PASSWORD|changeme}
    sslmode: ${POSTGRES_SSLMODE|disable}

# storage settings
storage:
  posters-dir: ${POSTERS_DIR|./storage/posters}
  max-poster-size-mb: ${MAX_POSTER_SIZE_MB|10}
  media-dir: ${MEDIA_DIR|./storage/media}
